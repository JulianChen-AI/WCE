<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信聊天工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#263b32;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1050px;margin:50px auto;padding:0 24px}small{color:#697b70}h1{font-size:30px;margin:10px 0}header p{color:#697b70;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}section{background:white;border:1px solid #dce5df;border-radius:16px;padding:24px}h2{font-size:18px;margin:0 0 18px}input[type=search]{width:100%;border:1px solid #b8cabe;border-radius:8px;padding:12px;font:inherit}button,.result{border:1px solid #c1d2c7;border-radius:8px;background:#fff;color:#284c37;padding:10px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#start{width:100%;background:#32674a;color:white;margin-top:16px}#groups{max-height:390px;overflow:auto;margin-top:14px}.group{display:flex;align-items:flex-start;gap:10px;padding:13px 4px;border-bottom:1px solid #edf1ee;cursor:pointer;overflow-wrap:anywhere}.group input{width:18px;height:18px;flex-shrink:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}#logs{background:#f4f7f5;border-radius:8px;padding:14px;height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 ui-monospace,monospace}#status{font-weight:600}.result{display:block;margin-top:10px;text-decoration:none}#error{color:#a2392b;white-space:pre-wrap}footer{color:#718176;font-size:12px;margin:20px 0;line-height:1.8}@media(max-width:740px){main{margin:24px auto}.layout{grid-template-columns:1fr}}
</style>
<main><header><small>本机微信 / 轻量工作台</small><h1>选择联系人或群聊，生成聊天档案</h1><p>读取本机已同步的消息，整理图片、语音和附件。每次另存新档案。</p></header>
<details id="setup-panel" style="background:white;padding:20px;border:1px solid #dce5df;border-radius:12px;margin-top:22px"><summary>首次配置 / 切换本机账号</summary>
<p id="setup-note"></p><label>自动发现的数据目录 <select id="accounts" style="width:100%;padding:10px"></select></label>
<label>微信 db_storage 目录 <input id="db-path" style="width:100%;padding:10px" placeholder="也可粘贴自定义数据路径"></label>
<label>数据库密钥 JSON（只保存在本机） <input id="key-file" type="file" accept=".json,application/json"></label>
<details><summary>高级：账号和图片参数</summary><label>自己的微信账号 ID（通常自动识别）<input id="own-id"></label><p>Windows 图片密钥单独配置；未配置时仍可导出文字和可用媒体。</p><label>图片 AES 密钥（32 位十六进制）<input id="image-key" type="password" autocomplete="off"></label><label>XOR 参数（0–255）<input id="xor-key" type="number" min="0" max="255" value="0"></label><label>导出目录（留空使用本机默认目录）<input id="output-path" style="width:100%"></label></details>
<p><label><input id="asr" type="checkbox"> 本地语音转写（首次需联网下载模型）</label></p><button id="save-setup">校验并保存</button><p id="setup-status" role="status"></p></details><div class="layout"><section><h2>1. 选择聊天对象</h2><label for="kind">会话类型</label> <select id="kind" style="min-height:44px;padding:8px;font:inherit;margin-bottom:14px"><option value="group">群聊</option><option value="contact">联系人</option></select><p><small>切换类型会清空选择；联系人列表来自本机通讯录，可能包含服务号。</small></p><label id="search-label" for="search">搜索群名称或 ID</label><input id="search" type="search" placeholder="输入群名或 ID"><div class="bar"><small id="count">正在读取群聊…</small><button id="refresh">刷新列表</button></div><div id="groups"></div><button id="start" disabled>导出所选群聊</button><p id="error" role="alert"></p></section>
<section><h2>2. 查看结果</h2><p id="status" role="status">等待选择聊天对象</p><pre id="logs">导出后，进度会显示在这里。</pre><div id="results"></div><small>完成后自动打开聊天档案，也可点击上方结果入口。</small></section></div><footer>范围：本机现存全部历史，媒体保持当前可获取大小。语音在本机转写，缺失表情可能联网补取。保持启动窗口运行。</footer></main>
<script>
const $=id=>document.getElementById(id);let groups=[],selected=new Set(),running=false,loading=false,loadVersion=0;
const selectionName=()=>$('kind').value==='contact'?'联系人':'群聊';
function render(){const q=$('search').value.toLowerCase(),label=selectionName();$('search-label').textContent='搜索'+label+'名称、备注或 ID';$('search').placeholder='输入'+label+'关键词或 ID';$('groups').replaceChildren();const visible=groups.filter(g=>[g.name,g.nickname,g.id].some(v=>(v||'').toLowerCase().includes(q)));for(const g of visible){const row=document.createElement('label');row.className='group';const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(g.id);box.disabled=running||loading;box.onchange=()=>{box.checked?selected.add(g.id):selected.delete(g.id);render();};const name=document.createElement('span');name.textContent=g.name+' · '+g.id;row.append(box,name);$('groups').append(row);}if(!visible.length)$('groups').textContent=loading?'正在读取'+label+'…':'没有匹配的'+label;$('count').textContent=visible.length+' 个'+label+' · 已选 '+selected.size+' 个';$('start').textContent='导出所选'+label;$('start').disabled=running||loading||!selected.size;$('kind').disabled=running||loading;$('refresh').disabled=running||loading;}
async function load(){const version=++loadVersion;loading=true;groups=[];render();try{$('error').textContent='';const kind=$('kind').value,r=await fetch(kind==='contact'?'/api/contacts':'/api/groups'),d=await r.json();if(version!==loadVersion)return;if(!r.ok)throw Error(d.error);groups=kind==='contact'?d.contacts:d.groups;selected=new Set([...selected].filter(id=>groups.some(g=>g.id===id)));}catch(e){if(version===loadVersion){selected.clear();$('error').textContent=e.message;}}finally{if(version===loadVersion){loading=false;render();}}}
$('search').oninput=render;$('refresh').onclick=load;
$('kind').onchange=()=>{selected.clear();$('search').value='';load();};
$('start').onclick=async()=>{running=true;render();$('error').textContent='';try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});const d=await r.json();if(!r.ok)throw Error(d.error);poll();}catch(e){running=false;render();$('error').textContent=e.message;}};
async function poll(){try{const d=await(await fetch('/api/status')).json();running=d.status==='running';$('status').textContent={idle:'等待选择聊天对象',running:'正在导出，请稍候…',done:'导出完成',failed:'导出未完成，请查看记录'}[d.status];$('logs').textContent=d.logs.join('\n')||'导出后，进度会显示在这里。';$('logs').scrollTop=$('logs').scrollHeight;$('results').replaceChildren();for(const result of d.results){const a=document.createElement('a');a.className='result';a.textContent='打开 '+result.name;a.href=result.url;a.target='_blank';a.rel='noopener';$('results').append(a);}render();}catch(e){$('status').textContent='工作台连接已断开，请检查启动窗口';}}
async function setup(){try{const d=await(await fetch('/api/setup')).json();$('setup-note').textContent='目标微信 '+d.target_version+' · '+(d.platform==='windows'?'Windows 读取适配待实机验证':'Mac')+'。密钥需从已有备份或可信本机工具取得；此版本不自动获取。';$('setup-panel').open=!d.configured;$('db-path').value=d.config.db_storage||d.accounts[0]||'';$('own-id').value=d.config.own_id||'';$('output-path').value=d.config.output_dir||'';$('asr').checked=!!d.config.transcribe;$('accounts').replaceChildren();for(const path of d.accounts){const o=document.createElement('option');o.value=path;o.textContent=path;$('accounts').append(o);}$('accounts').onchange=()=>{$('db-path').value=$('accounts').value;};if(d.configured)load();else{$('count').textContent='请先完成配置';}}catch(e){$('setup-status').textContent=e.message;}}
$('save-setup').onclick=async()=>{const b=$('save-setup');b.disabled=true;try{$('setup-status').textContent='校验本机数据库…';const keyFile=$('key-file').files[0];const config={db_storage:$('db-path').value,own_id:$('own-id').value,output_dir:$('output-path').value,transcribe:$('asr').checked};if($('image-key').value){config.image_key=$('image-key').value;config.xor_key=Number($('xor-key').value);}const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config,keys:keyFile?JSON.parse(await keyFile.text()):null})});const d=await r.json();if(!r.ok)throw Error(d.error);$('setup-status').textContent='配置已保存，可以选择联系人或群聊了。';$('image-key').value='';$('key-file').value='';selected.clear();await load();}catch(e){$('setup-status').textContent=e.message;}finally{b.disabled=false;}};
setup();poll();setInterval(poll,1500);
</script></html>

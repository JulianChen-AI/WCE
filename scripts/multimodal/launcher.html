<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信聊天工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#263b32;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1050px;margin:28px auto;padding:0 24px}small{color:#697b70}h1{font-size:28px;margin:10px 0}header p{color:#697b70;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}section{background:white;border:1px solid #dce5df;border-radius:16px;padding:20px}h2{font-size:18px;margin:0 0 18px}input[type=search]{width:100%;border:1px solid #b8cabe;border-radius:8px;padding:12px;font:inherit}button,.result{border:1px solid #c1d2c7;border-radius:8px;background:#fff;color:#284c37;padding:10px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#start{width:100%;background:#32674a;color:white;margin-top:16px}#groups{max-height:390px;overflow:auto;margin-top:14px}.group{display:flex;align-items:flex-start;gap:10px;padding:13px 4px;border-bottom:1px solid #edf1ee;cursor:pointer;overflow-wrap:anywhere}.group input{width:18px;height:18px;flex-shrink:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}#logs{background:#f4f7f5;border-radius:8px;padding:14px;height:280px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 ui-monospace,monospace}#status{font-weight:600}.result{display:block;margin-top:10px;text-decoration:none}#error{color:#a2392b;white-space:pre-wrap}footer{color:#718176;font-size:12px;margin:20px 0;line-height:1.8}@media(max-width:740px){main{margin:24px auto}.layout{grid-template-columns:1fr}}

#groups{max-height:480px;border:1px solid #e0e8e2;border-radius:12px;background:#fff}
.group{position:relative;align-items:center;gap:12px;padding:14px 12px;min-height:76px;transition:background .12s;border-bottom:1px solid #edf1ee}
.group:last-child{border-bottom:0}.group:hover{background:#f5f8f6}.group.is-selected{background:#eaf3ed}.group:focus-within{outline:2px solid #32674a;outline-offset:-2px}.group input{accent-color:#32674a;margin:0}
.avatar{position:relative;display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border-radius:11px;overflow:hidden;background:#e0ece3;color:#31583f;font-size:20px;font-weight:600}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.avatar.group-avatar{background:#e5eaf4;color:#3d537b}
.contact-copy{min-width:0;flex:1}.contact-name{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contact-detail{display:block;margin-top:5px;color:#586d60;font-size:12px;overflow-wrap:anywhere;line-height:1.5}.last-active{font-size:12px;color:#586d60;flex-shrink:0}
.list-options{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:14px 0}.list-options select{padding:9px;min-height:44px;font:inherit;border:1px solid #b8cabe;border-radius:8px;background:white;color:inherit}.list-options label{display:flex;align-items:center;gap:6px}.list-options input{accent-color:#32674a}#list-note{display:block;line-height:1.7}#more{display:block;width:100%;margin-top:10px}#more[hidden]{display:none}#empty{padding:24px 14px;color:#586d60;line-height:1.8}
@media(max-width:440px){.group{gap:9px;padding:12px 9px}.last-active{display:none}section{padding:18px}}
</style>
<main><header><small>本机微信 / 轻量工作台</small><h1>选择联系人或群聊，生成聊天档案</h1><p>读取本机已同步的消息，整理图片、语音和附件。每次另存新档案。</p></header>
<details id="setup-panel" style="background:white;padding:14px;border:1px solid #dce5df;border-radius:12px;margin-top:16px"><summary>首次配置 / 切换本机账号</summary>
<p id="setup-note"></p><label>自动发现的数据目录 <select id="accounts" style="width:100%;padding:10px"></select></label>
<label>微信 db_storage 目录 <input id="db-path" style="width:100%;padding:10px" placeholder="也可粘贴自定义数据路径"></label>
<label>数据库密钥 JSON（只保存在本机） <input id="key-file" type="file" accept=".json,application/json"></label>
<details><summary>高级：账号和图片参数</summary><label>自己的微信账号 ID（通常自动识别）<input id="own-id"></label><p>Windows 图片密钥单独配置；未配置时仍可导出文字和可用媒体。</p><label>图片 AES 密钥（32 位十六进制）<input id="image-key" type="password" autocomplete="off"></label><label>XOR 参数（0–255）<input id="xor-key" type="number" min="0" max="255" value="0"></label><label>导出目录（留空使用本机默认目录）<input id="output-path" style="width:100%"></label></details>
<p><label><input id="asr" type="checkbox"> 本地语音转写（首次需联网下载模型）</label></p><button id="save-setup">校验并保存</button><p id="setup-status" role="status"></p></details><div class="layout"><section><h2>1. 选择聊天对象</h2><label for="kind">会话类型</label> <select id="kind" style="min-height:44px;padding:8px;font:inherit;margin-bottom:6px"><option value="group">群聊</option><option value="contact">联系人</option></select><small id="list-note">默认显示最近会话，按最近聊天排序。头像只读取本机缓存。</small><label id="search-label" for="search">搜索群名称或 ID</label><input id="search" type="search" placeholder="输入群名或 ID"><div class="list-options"><label for="scope">显示范围 <select id="scope"><option value="recent">最近会话（推荐）</option><option value="all">全部列表</option></select></label><label><input id="show-id" type="checkbox">显示账号 ID</label></div><div class="bar"><small id="count" aria-live="polite">正在读取群聊…</small><button id="refresh">刷新列表</button></div><div id="groups"></div><button id="more" hidden>显示更多</button><div class="bar"><small>切换类型会清空选择</small><button id="clear-selection" disabled>清空选择</button></div><button id="start" disabled>导出所选群聊</button><p id="error" role="alert"></p></section>
<section><h2>2. 查看结果</h2><p id="status" role="status">等待选择聊天对象</p><pre id="logs">导出后，进度会显示在这里。</pre><div id="results"></div><small>完成后自动打开聊天档案，也可点击上方结果入口。</small></section></div><footer>范围：本机现存全部历史，媒体保持当前可获取大小。语音在本机转写，缺失表情可能联网补取。保持启动窗口运行。</footer></main>
<script>
const $=id=>document.getElementById(id);let groups=[],selected=new Set(),running=false,loading=false,loadVersion=0,limit=80,matchingCount=0;
const selectionName=()=>$('kind').value==='contact'?'联系人':'群聊';
function updateControls(){
  $('count').textContent=matchingCount+' 个'+selectionName()+' · 已选 '+selected.size+' 个';
  $('start').textContent='导出所选'+selectionName();$('start').disabled=running||loading||!selected.size;
  $('kind').disabled=running||loading;$('refresh').disabled=running||loading;
  $('scope').disabled=running||loading;$('clear-selection').disabled=running||loading||!selected.size;
}
function render(){
  const q=$('search').value.trim().toLowerCase(),label=selectionName();
  $('search-label').textContent='搜索'+label+'名称、备注或 ID';$('search').placeholder='输入'+label+'关键词或 ID';
  const recentAvailable=groups.some(g=>g.has_history!==null&&g.has_history!==undefined);
  $('list-note').textContent=recentAvailable?'默认显示最近会话，按最近聊天排序。头像只读取本机缓存；全部列表可能包含群成员或缺少名称的旧会话。':'未读到最近会话信息，暂显示全部列表。头像只读取本机缓存。';
  const visible=groups.filter(g=>($('scope').value==='all'||g.has_history!==false)&&[g.name,g.nickname,g.id].some(v=>(v||'').toLowerCase().includes(q)));
  matchingCount=visible.length;const scroll=$('groups').scrollTop;$('groups').replaceChildren();
  for(const g of visible.slice(0,limit)){
    const row=document.createElement('label');row.className='group'+(selected.has(g.id)?' is-selected':'');row.title=g.name+' · '+g.id;
    const box=document.createElement('input');box.type='checkbox';box.checked=selected.has(g.id);box.disabled=running||loading;box.setAttribute('aria-label','选择'+g.name+'，账号 '+g.id);
    box.onchange=()=>{box.checked?selected.add(g.id):selected.delete(g.id);row.classList.toggle('is-selected',box.checked);updateControls();};
    const picture=document.createElement('span');picture.className='avatar';if(g.kind==='group')picture.classList.add('group-avatar');picture.setAttribute('aria-hidden','true');picture.textContent=g.kind==='group'?'群':g.named?Array.from(g.name)[0]:'人';
    const img=document.createElement('img');img.alt='';img.width=44;img.height=44;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.src='/api/avatar/'+encodeURIComponent(g.id);img.onerror=()=>img.remove();picture.append(img);
    const copy=document.createElement('span');copy.className='contact-copy';const name=document.createElement('span');name.className='contact-name';name.textContent=g.name;
    const detail=document.createElement('span');detail.className='contact-detail';detail.textContent=g.named?(g.nickname&&g.nickname!==g.name?'昵称：'+g.nickname:label):'账号：'+g.id;
    if(g.named&&$('show-id').checked)detail.textContent+=' · '+g.id;copy.append(name,detail);row.append(box,picture,copy);
    if(g.last_active){const time=document.createElement('span');time.className='last-active';time.textContent=new Date(g.last_active*1000).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});row.append(time);}
    $('groups').append(row);
  }
  if(!visible.length){const empty=document.createElement('div');empty.id='empty';empty.textContent=loading?'正在读取'+label+'…':'没有匹配的'+label+($('scope').value==='recent'?'，可切换到“全部列表”查找。':'。');$('groups').append(empty);}
  $('groups').scrollTop=scroll;$('more').hidden=visible.length<=limit;$('more').textContent='显示更多（还有 '+Math.max(0,visible.length-limit)+' 个）';updateControls();
}
async function load(){const version=++loadVersion;loading=true;groups=[];render();try{$('error').textContent='';const kind=$('kind').value,r=await fetch(kind==='contact'?'/api/contacts':'/api/groups'),d=await r.json();if(version!==loadVersion)return;if(!r.ok)throw Error(d.error);groups=kind==='contact'?d.contacts:d.groups;selected=new Set([...selected].filter(id=>groups.some(g=>g.id===id)));}catch(e){if(version===loadVersion){selected.clear();$('error').textContent=e.message;}}finally{if(version===loadVersion){loading=false;render();}}}
$('search').oninput=()=>{limit=80;render();};$('refresh').onclick=load;
$('scope').onchange=()=>{limit=80;render();};$('show-id').onchange=render;$('more').onclick=()=>{limit+=80;render();};$('clear-selection').onclick=()=>{selected.clear();render();};
$('kind').onchange=()=>{selected.clear();limit=80;$('search').value='';load();};
$('start').onclick=async()=>{running=true;render();$('error').textContent='';try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[...selected]})});const d=await r.json();if(!r.ok)throw Error(d.error);poll();}catch(e){running=false;render();$('error').textContent=e.message;}};
async function poll(){try{const d=await(await fetch('/api/status')).json();const wasRunning=running;running=d.status==='running';$('status').textContent={idle:'等待选择聊天对象',running:'正在导出，请稍候…',done:'导出完成',failed:'导出未完成，请查看记录'}[d.status];$('logs').textContent=d.logs.join('\n')||'导出后，进度会显示在这里。';$('logs').scrollTop=$('logs').scrollHeight;$('results').replaceChildren();for(const result of d.results){const a=document.createElement('a');a.className='result';a.textContent='打开 '+result.name;a.href=result.url;a.target='_blank';a.rel='noopener';$('results').append(a);}if(wasRunning!==running)render();}catch(e){$('status').textContent='工作台连接已断开，请检查启动窗口';}}
async function setup(){try{const d=await(await fetch('/api/setup')).json();$('setup-note').textContent='目标微信 '+d.target_version+' · '+(d.platform==='windows'?'Windows 读取适配待实机验证':'Mac')+'。密钥需从已有备份或可信本机工具取得；此版本不自动获取。';$('setup-panel').open=!d.configured;$('db-path').value=d.config.db_storage||d.accounts[0]||'';$('own-id').value=d.config.own_id||'';$('output-path').value=d.config.output_dir||'';$('asr').checked=!!d.config.transcribe;$('accounts').replaceChildren();for(const path of d.accounts){const o=document.createElement('option');o.value=path;o.textContent=path;$('accounts').append(o);}$('accounts').onchange=()=>{$('db-path').value=$('accounts').value;};if(d.configured)load();else{$('count').textContent='请先完成配置';}}catch(e){$('setup-status').textContent=e.message;}}
$('save-setup').onclick=async()=>{const b=$('save-setup');b.disabled=true;try{$('setup-status').textContent='校验本机数据库…';const keyFile=$('key-file').files[0];const config={db_storage:$('db-path').value,own_id:$('own-id').value,output_dir:$('output-path').value,transcribe:$('asr').checked};if($('image-key').value){config.image_key=$('image-key').value;config.xor_key=Number($('xor-key').value);}const r=await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config,keys:keyFile?JSON.parse(await keyFile.text()):null})});const d=await r.json();if(!r.ok)throw Error(d.error);$('setup-status').textContent='配置已保存，可以选择联系人或群聊了。';$('image-key').value='';$('key-file').value='';selected.clear();await load();}catch(e){$('setup-status').textContent=e.message;}finally{b.disabled=false;}};
setup();poll();setInterval(poll,1500);
</script></html>

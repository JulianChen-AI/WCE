<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">WCE 微信全导</title><desc id="desc">把微信聊天留成自己的档案。右侧为虚构联系人选择界面示意。</desc>
<rect width="1200" height="650" fill="#edf4f0"/><path d="M770 0h430v650H990Z" fill="#dcebe3"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="64" y="65" width="44" height="44" rx="13" fill="#32664e"/><text x="86" y="95" text-anchor="middle" font-size="25" font-weight="700" fill="white">W</text><text x="122" y="94" font-size="18" fill="#426050">WCE · 微信全导 / WeChat Export</text>
<text x="64" y="235" font-size="58" font-weight="750" fill="#213e32">把微信聊天，</text><text x="64" y="315" font-size="58" font-weight="750" fill="#213e32">留成自己的档案。</text>
<text x="67" y="375" font-size="21" fill="#60786b">选择联系人或群聊，整理消息与附件。</text>
<g fill="#dbe9e0"><rect x="64" y="423" width="120" height="40" rx="20"/><rect x="196" y="423" width="120" height="40" rx="20"/><rect x="328" y="423" width="120" height="40" rx="20"/></g>
<g fill="#32664e" font-size="16" text-anchor="middle"><text x="124" y="450">联系人分类</text><text x="256" y="450">批量导出</text><text x="388" y="450">本机保存</text></g>
<text x="67" y="571" font-size="16" fill="#71857a">Mac 测试版 · 需要授权与有效密钥</text>
<rect x="660" y="144" width="460" height="374" rx="18" fill="#c9ddd1"/><rect x="650" y="132" width="460" height="374" rx="18" fill="white"/>
<g fill="#c5d5cc"><circle cx="672" cy="153" r="4"/><circle cx="687" cy="153" r="4"/><circle cx="702" cy="153" r="4"/></g><path d="M650 173h460" stroke="#e8eeea"/>
<text x="677" y="210" font-size="21" font-weight="650" fill="#213e32">选择聊天对象</text><text x="1080" y="209" text-anchor="end" font-size="12" fill="#7b8c82">界面示意 · 虚构数据</text>
